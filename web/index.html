<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f9f6" />
  <title>CN230 · Thailand Petroleum Lifecycle & LCI Workbench</title>

  <!-- Performance Preconnects -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
  <link rel="dns-prefetch" href="https://server.arcgisonline.com" />

  <!-- Typography matching web-2 minimal design system + Thai legibility -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap"
  />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>
<body>
  <div id="root"></div>
  <script>
    // Seamless routing for static Python / file servers:
    // When served via static web server without Vite, redirect to pre-built dist bundle
    (function() {
      if (!window.__vite_plugin_react_preamble_installed__) {
        fetch('/src/main.tsx', { method: 'HEAD' })
          .then(function(res) {
            var ct = (res.headers.get('content-type') || '').toLowerCase();
            if (!ct.includes('javascript') && (location.pathname === '/' || location.pathname === '/index.html')) {
              location.replace('/dist/');
            }
          })
          .catch(function() {});
      }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
